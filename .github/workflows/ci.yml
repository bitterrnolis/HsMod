name: Auto Build Test

on:
  push:
    branches: [ "bepinex5" ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Checkout the repository
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    
    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore --locked-mode
    
    # Build the project
    - name: Build HsMod
      run: dotnet build --configuration Release --no-restore
# Build the project
    - name: Build HsMod
      # 加了 -o ./BuildOutput 参数，强制把编译好的文件全部塞进这个名叫 BuildOutput 的文件夹里
      run: dotnet build --configuration Release --no-restore -o ./BuildOutput
      
    # 上传编译好的文件供下载
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HsMod-Release-Build
        # 直接去刚才指定的那个文件夹里打包上传
        path: ./BuildOutput/
